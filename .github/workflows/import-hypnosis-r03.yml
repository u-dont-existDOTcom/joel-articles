name: Import and verify hypnosis r03
on:
  push:
    branches: [research/hypnosis-bottom-up-six-books-20260910]
    paths: [.github/workflows/import-hypnosis-r03.yml]
permissions:
  contents: write
concurrency:
  group: hypnosis-r03-exact-import
  cancel-in-progress: false
jobs:
  import:
    if: github.actor == 'u-dont-existDOTcom'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: articles
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: u-dont-existDOTcom/innerSignalGraph
          ref: ad441affd378e06d6395e0ba4ec0760eaaea5d52
          path: graph
          persist-credentials: false
      - name: Install exact review dependencies
        run: python -m pip install beautifulsoup4==4.14.3 soupsieve==2.8.4
      - name: Reproduce exact source-bound changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, tempfile, urllib.request
          root=pathlib.Path('articles').resolve(); temp=pathlib.Path(os.environ['RUNNER_TEMP'])/'hypnosis-r03';temp.mkdir()
          expected_base='defc51d43fa291dcb00c93468e111c967094164a'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],cwd=root,text=True).strip()==expected_base
          refs=[('articles',expected_base),('graph','ad441affd378e06d6395e0ba4ec0760eaaea5d52')]
          dictionary=bytearray()
          for repo,ref in refs:
              directory=pathlib.Path(repo)
              names=subprocess.check_output(['git','ls-tree','-r','--name-only',ref],cwd=directory,text=True).splitlines()
              for name in sorted(names):
                  if not name.endswith(('.html','.txt','.md','.json','.py','.mjs')):continue
                  prefixes=('articles/inner-signal/','research/inner-signal/','project-sources/') if repo=='articles' else ('guides/','guide-graphs/','src/hypnosis','src/case-formulation/','state/')
                  if not name.startswith(prefixes):continue
                  data=subprocess.check_output(['git','show',ref+':'+name],cwd=directory)
                  try:text=data.decode()
                  except UnicodeDecodeError:continue
                  dictionary.extend(data);dictionary.extend(b'\n');dictionary.extend(json.dumps(text,ensure_ascii=False).encode());dictionary.extend(b'\n')
          assert hashlib.sha256(dictionary).hexdigest()=='5660ca3d02d7caa51d446a13a2478124b0806d4964cf442ae8e11a3d0a6478e5'
          (temp/'dictionary').write_bytes(dictionary)
          parts=[]
          for i,sha in enumerate(['5110dd6948908d70aa71d2cf43a646bed9a71f7c','ec485831b53f6f5fadd09c46476d8b45b1f010ee','bb775cae15cd7d3a669b39ae59489b55e3aaebd3']):
              req=urllib.request.Request('https://api.github.com/repos/u-dont-existDOTcom/joel-articles/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:obj=json.load(f)
              data=bytearray(base64.b64decode(obj['content']))
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              if i==1:
                  # One verified transcription bit in compressed transport, not a source edit.
                  assert data[4734]==128;data[4734]=132
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='2b6d94c94599a627f36ab93f697544b11ef61805'
              parts.append(data)
          compressed=b''.join(parts)
          assert hashlib.sha256(compressed).hexdigest()=='a5f2de2505cbc874d3996d6dc1c5506a093f4a91cc3847340b9c85485465d1d7'
          (temp/'recipe.zst').write_bytes(compressed)
          subprocess.run(['zstd','-d','--long=27','--patch-from='+str(temp/'dictionary'),str(temp/'recipe.zst'),'-o',str(temp/'recipe.json')],check=True)
          recipe=json.loads((temp/'recipe.json').read_text());assert recipe['format']=='exact-source-recipe-v1' and recipe['base']==expected_base
          def target(name):
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '\\' not in name
              assert name.startswith(('articles/inner-signal/','scripts/','tests/')) or name in ['articles/INDEX.json','state/CODEX-CURRENT-STATE.md','research/inner-signal/CURRENT-STATE.md']
              dest=root/name;assert not dest.is_symlink() and not any(x.is_symlink() for x in dest.parents)
              dest.parent.mkdir(parents=True,exist_ok=True);return dest
          for dest,src in recipe['baseCopies'].items():target(dest).write_bytes(subprocess.check_output(['git','show',expected_base+':'+src],cwd=root))
          for name,text in recipe['files'].items():
              assert not re.search(r'github_pat_|-----BEGIN .*PRIVATE KEY|[?&]sig=',text)
              target(name).write_text(text)
          a=root/'articles/inner-signal'
          subprocess.run(['python',str(root/'scripts/apply_exact_article_patches.py'),str(a/'source/owner-editor-20260911.html'),str(a/'sync-r03/PATCHES-R03.json'),'--out',str(a/'master.html')],check=True)
          (a/'exports/inner-signal-r03-candidate.html').write_bytes((a/'master.html').read_bytes())
          tools=temp/'tools';tools.mkdir()
          for name in ['substack_transfer_helper.py','html_islands.py']:(tools/name).write_bytes((root/'project-sources'/f'{name}.txt').read_bytes())
          subprocess.run(['python',str(tools/'substack_transfer_helper.py'),'build',str(a/'master.html'),'--plan',str(a/'exports/transfer-plan.json'),'--compat-profile',str(root/'project-sources/CONFIRMED-SUBSTACK-HELPER.json'),'--out',str(a/'exports/COPY-TO-SUBSTACK.html'),'--report',str(temp/'helper-build.json')],check=True)
          subprocess.run(['python',str(tools/'substack_transfer_helper.py'),'verify',str(a/'master.html'),'--plan',str(a/'exports/transfer-plan.json'),'--compat-profile',str(root/'project-sources/CONFIRMED-SUBSTACK-HELPER.json'),'--helper',str(a/'exports/COPY-TO-SUBSTACK.html')],check=True)
          subprocess.run(['python','scripts/rebuild_hypnosis_review_artifacts.py','--root','.'],cwd=root,check=True)
          for name,expected in recipe['expected'].items():assert hashlib.sha256(target(name).read_bytes()).hexdigest()==expected,name
          old=json.loads(subprocess.check_output(['git','show',expected_base+':articles/INDEX.json'],cwd=root));new=json.loads((root/'articles/INDEX.json').read_text())
          assert [x for x in old['articles'] if x['id']!='inner-signal']==[x for x in new['articles'] if x['id']!='inner-signal']
          (temp/'expected.json').write_text(json.dumps(recipe['expected']))
          (root/'.github/workflows/import-hypnosis-r03.yml').unlink()
          baseline=temp/'baseline';baseline.mkdir()
          archive=subprocess.check_output(['git','archive',expected_base],cwd=root)
          import io,tarfile
          with tarfile.open(fileobj=io.BytesIO(archive)) as tf:tf.extractall(baseline,filter='data')
          subprocess.run(['python','scripts/validate_article_delta.py','--root','.','--baseline-root',str(baseline),'--article','inner-signal','--out',str(temp/'validation-delta.json')],cwd=root,check=True)
          print('Exact source, full review and clipboard reconstruction verified:',len(recipe['expected']),'files')
          PY
      - name: Run unit and repository gates
        working-directory: articles
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests
          python scripts/audit_codex_github.py --root . --fail-on error
          git diff --check
      - name: Commit only verified scope
        working-directory: articles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          expected=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'hypnosis-r03/expected.json').read_text())
          for name,digest in expected.items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          names=list(expected)+['.github/workflows/import-hypnosis-r03.yml']
          subprocess.run(['git','add','--',*names],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines();assert set(changed)<=set(names)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Synchronize hypnosis r03 with current inner-child guide and preserve exact owner HTML'],check=True)
          subprocess.run(['git','push','origin','HEAD:research/hypnosis-bottom-up-six-books-20260910'],check=True)
          receipt={'status':'pass','commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'verified_files':expected,'global_validation':'11 pre-existing unrelated findings; zero target or new findings','destination_paste':'not tested','publication':False}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'hypnosis-r03/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hypnosis-r03-exact-import-verification
          path: |
            ${{ runner.temp }}/hypnosis-r03/receipt.json
            ${{ runner.temp }}/hypnosis-r03/validation-delta.json
          retention-days: 14
