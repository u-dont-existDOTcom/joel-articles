name: Temporary Somatic experiment artifact registration

on:
  push:
    branches:
      - agent/somatic-humanization-r02-preservation-20260824
    paths:
      - '.github/workflows/register-somatic-experiment-artifacts-temp.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-24.04
    if: github.actor == 'u-dont-existDOTcom'
    steps:
      - name: Check out task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/somatic-humanization-r02-preservation-20260824
          fetch-depth: 0
      - name: Refresh exact experiment artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('articles/INDEX.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          a = next(x for x in data['articles'] if x['id'] == 'somatic-therapies')
          for item in a.get('additional_artifacts', []):
              path = Path(item['path'])
              if path.parts[:3] == ('articles','somatic-therapies','experiments') and path.is_file():
                  item['sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit refreshed registry
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- articles/INDEX.json; then exit 0; fi
          git config user.name 'Somatic Artifact Registry Actions'
          git config user.email 'somatic-artifact-registry@users.noreply.github.com'
          git add articles/INDEX.json
          git commit -m 'Refresh Somatic experiment artifact hashes'
          git push origin HEAD:agent/somatic-humanization-r02-preservation-20260824
