name: Temporary Somatic experiment artifact registration

on:
  push:
    branches:
      - agent/somatic-humanization-r02-preservation-20260824
    paths:
      - '.github/workflows/register-somatic-experiment-artifacts-temp.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-24.04
    if: github.actor == 'u-dont-existDOTcom'
    steps:
      - name: Check out task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/somatic-humanization-r02-preservation-20260824
          fetch-depth: 0

      - name: Register exact experiment artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          index_path = Path('articles/INDEX.json')
          data = json.loads(index_path.read_text(encoding='utf-8'))
          article = next(a for a in data['articles'] if a['id'] == 'somatic-therapies')
          artifacts = article.setdefault('additional_artifacts', [])
          by_path = {item['path']: item for item in artifacts}

          def role_for(name: str) -> str:
              if 'OWNER-LANGUAGE-SOURCE' in name:
                  return 'owner_source_evidence'
              if 'OWNER-LANGUAGE-HANDOFF' in name:
                  return 'owner_language_handoff'
              if 'REQUESTED-FACT-CHECK' in name:
                  return 'fact_check_record'
              if 'PRESERVATION-RECEIPT' in name or name.endswith('-PRESERVATION-20260822.json'):
                  return 'preservation_proof'
              if 'PANGRAM-BOUNDARY' in name:
                  return 'detector_input'
              if 'PANGRAM-RESULT' in name or name.endswith('-RESULTS-20260822.json'):
                  return 'detector_experiment_result'
              if 'PANGRAM-PREFLIGHT' in name or 'PRODUCTION-PREFLIGHT' in name:
                  return 'detector_preflight'
              if 'EXECUTION-STATE' in name:
                  return 'experiment_execution_state'
              if 'HTML-PROMOTION-CONTRACT' in name:
                  return 'html_promotion_contract'
              if 'PROMOTION-HTML-FRAGMENT' in name:
                  return 'html_promotion_candidate'
              if 'CHECKPOINT' in name:
                  return 'experiment_checkpoint'
              if 'CANDIDATE' in name:
                  return 'humanization_candidate'
              if 'AUTHORIAL-FLOW-INPUT' in name:
                  return 'authorial_flow_input'
              if 'AUTHORIAL-STATE-PILOT' in name:
                  return 'detector_experiment_design'
              return 'experiment_artifact'

          root = Path('articles/somatic-therapies/experiments')
          for path in sorted(p for p in root.iterdir() if p.is_file()):
              rel = path.as_posix()
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if rel in by_path:
                  by_path[rel]['sha256'] = digest
              else:
                  item = {'path': rel, 'sha256': digest, 'role': role_for(path.name)}
                  artifacts.append(item)
                  by_path[rel] = item

          # Keep the inventory deterministic without changing authority semantics.
          article['additional_artifacts'] = sorted(artifacts, key=lambda item: item['path'])
          index_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit registry update to the task branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- articles/INDEX.json; then
            echo 'No registry changes required.'
            exit 0
          fi
          git config user.name 'Somatic Artifact Registry Actions'
          git config user.email 'somatic-artifact-registry@users.noreply.github.com'
          git add articles/INDEX.json
          git commit -m 'Register Somatic humanization experiment artifacts'
          git push origin HEAD:agent/somatic-humanization-r02-preservation-20260824
