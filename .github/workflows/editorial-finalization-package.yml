name: Editorial finalization package
on:
  push:
    branches: [chat/community-finalize-20261019]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editorial-finalization-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install -r tools/editorial/requirements.txt
      - name: Run editorial and exact-selection regressions
        run: python -m unittest discover -s tests -p test_editorial_delivery_gate.py -v
      - name: Verify canonical review package
        run: |
          cp project-sources/review_package.py.txt /tmp/review_package.py
          python /tmp/review_package.py verify articles/intentional-communities/candidate/finalization-20261019/Canonical-Review-Package.zip
      - name: Enforce exact package gate
        run: |
          mkdir -p delivery
          python tools/editorial/editorial_gate.py package --bundle articles/intentional-communities/candidate/finalization-20261019 --out delivery/Community-Finalization-r03.zip
      - name: Upload verified owner-review files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: community-finalization-r03
          path: delivery/Community-Finalization-r03.zip
          if-no-files-found: error
          retention-days: 30
