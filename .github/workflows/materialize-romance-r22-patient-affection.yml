name: Materialize Romance r22 patient and Affection

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 29
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: task/romance-detector-repair-20260820
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Materialize hash-gated r22 candidate
        run: python work/romance-detector-repair-20260820/recovery-20260823/materialize_r22_patient_affection.py
      - name: Commit candidate to Romance task branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/romance-detector-repair-20260820/materialized-preservation-r22-patient-affection
          if git diff --cached --quiet; then
            echo 'No materialization delta to commit.'
            exit 0
          fi
          git commit -m 'Materialize Romance r22 patient and Affection candidate'
          git push origin HEAD:task/romance-detector-repair-20260820
