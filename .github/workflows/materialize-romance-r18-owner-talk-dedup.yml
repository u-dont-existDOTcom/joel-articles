name: Materialize Romance r18 owner Talk dedup

on:
  push:
    branches:
      - task/romance-detector-repair-20260820
    paths:
      - '.github/workflows/materialize-romance-r18-owner-talk-dedup.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: task/romance-detector-repair-20260820
          fetch-depth: 0
      - name: Build exact r18 Markdown candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          src = Path('work/romance-detector-repair-20260820/materialized-preservation-r17-owner-talk/candidate-master.md')
          text = src.read_text(encoding='utf-8')
          if hashlib.sha256(text.encode()).hexdigest() != '7f3353498c31d6ee235d1b653d6fccfc41d7e4f3aed93684e238b96e622359c3':
              raise SystemExit('r17 Markdown source SHA mismatch')
          old = "Most couples don’t talk honestly about sex until they’re already having it. Bad timing. Now saying what you actually want might interrupt the whole thing, disappoint somebody, or turn a moment of passion into a negotiation. Talk before you’re naked. That conversation is already part of making love."
          new = "That conversation is already part of making love."
          owner = "It's important to talk about sexual compatibility before getting undressed, even if that kills the vibe. I remember reading a Christian magazine's letter from a newlywed Christian woman who found out that her husband didn't have much interest in sex after she saved herself for marriage. He trapped her, because he knew she would not feel good about divorce due to the religion. Of course, it didn't have to be nefarious. I had a relationship with E. that was a bit like that about 15yrs ago. She wanted sex once a week and it was driving me nuts because my libido was thru the roof. She also had no interest in trying to take any herb to increase her desire. Of course everyone does change over time as well, so communication should remain open beyond a simple interview."
          if text.count(old) != 1 or text.count(owner) != 1:
              raise SystemExit('r18 exact source anchors not unique')
          candidate = text.replace(old, new, 1)
          if candidate.count(owner) != 1:
              raise SystemExit('owner paragraph changed')
          if candidate.count('[NATIVE ') != text.count('[NATIVE '):
              raise SystemExit('native object count changed')
          if candidate.count('](http') != text.count('](http'):
              raise SystemExit('markdown link count changed')

          outdir = Path('work/romance-detector-repair-20260820/materialized-preservation-r18-owner-talk-dedup')
          outdir.mkdir(parents=True, exist_ok=True)
          out = outdir / 'candidate-master.md'
          out.write_text(candidate, encoding='utf-8')
          manifest = {
              'schema_version': 1,
              'candidate_id': 'romance-detector-repair-20260820-preservation-r18-owner-talk-dedup',
              'base': {'path': str(src), 'sha256': hashlib.sha256(text.encode()).hexdigest()},
              'candidate': {'path': str(out), 'sha256': hashlib.sha256(candidate.encode()).hexdigest(), 'word_count_whitespace': len(candidate.split())},
              'pangram_part1': {'sha256': '093289ce0cb3bdd216ae8e1fd584d4a0b426984a4c2edca97ba3ed75fed36ac9', 'word_count_whitespace': 10360},
              'stable_part2': {'sha256': '9e4c6a522c95741c7dfc9e040b2dcc40773427cbc0aef8f45211de77208b0c85', 'pangram_4_fraction_human': 1.0},
              'operation': {'type': 'duplicate-function-consolidation', 'old_sha256': hashlib.sha256(old.encode()).hexdigest(), 'new_sha256': hashlib.sha256(new.encode()).hexdigest(), 'owner_paragraph_sha256_unchanged': hashlib.sha256(owner.encode()).hexdigest()},
              'native_object_count_unchanged': True,
              'markdown_link_count_unchanged': True,
              'unexplained_deltas': 0,
              'status': 'task candidate only; canonical main unchanged'
          }
          (outdir / 'candidate-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - name: Commit r18 Markdown candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/romance-detector-repair-20260820/materialized-preservation-r18-owner-talk-dedup
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize Romance r18 owner Talk dedup candidate'
          git push origin HEAD:task/romance-detector-repair-20260820
