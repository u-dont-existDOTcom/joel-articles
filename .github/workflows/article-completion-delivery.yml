name: Approved community and Inner Child review delivery
on:
  push:
    branches: [chat/community-approved-innerchild-editorial-20261020]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: article-completion-delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install existing parser dependency
        run: python -m pip install -r tools/editorial/requirements.txt
      - name: Verify source type and exact-selection regressions
        run: |
          python -m unittest discover -s tests -p test_native_audio_classification.py -v
          python -m unittest discover -s tests -p test_editorial_delivery_gate.py -v
      - name: Verify exact delivery identities and canonical packages
        run: |
          cp project-sources/review_package.py.txt /tmp/review_package.py
          python state/tasks/community-innerchild-20261020/verify_delivery.py
          python /tmp/review_package.py verify state/tasks/community-innerchild-20261020/delivery/Community-r04-Approved.zip
          python /tmp/review_package.py verify state/tasks/community-innerchild-20261020/delivery/Inner-Child-r03-Editorial-Review.zip
      - name: Verify registered article authority
        run: python scripts/validate_content_repository.py --root .
      - name: Upload exact checked article families
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: community-approved-and-innerchild-review
          path: state/tasks/community-innerchild-20261020/delivery/*
          if-no-files-found: error
          retention-days: 30
