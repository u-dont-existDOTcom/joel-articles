name: Materialize Romance owner-integrated candidate

on:
  push:
    branches:
      - task/romance-detector-repair-20260820
    paths:
      - 'work/romance-detector-repair-20260820/apply_owner_integrated.py'
      - 'work/romance-detector-repair-20260820/OWNER-MUSES-REWRITE-LESSON-20260821.md'
      - 'work/romance-detector-repair-20260820/OWNER-ACCEPTED-LEADERSHIP-REWRITE-20260821.md'
      - 'work/romance-detector-repair-20260820/OWNER-EXCLUSIVITY-REWRITE-20260821.md'
      - 'work/romance-detector-repair-20260820/OWNER-PINKEST-REWRITE-20260821.md'
      - 'tests/test_romance_owner_integrated_materializer.py'
      - '.github/workflows/materialize-romance-owner-integrated.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out task branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: task/romance-detector-repair-20260820
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Run owner-integrated materializer regression
        run: python -m unittest tests.test_romance_owner_integrated_materializer -q

      - name: Materialize owner-integrated candidate
        run: |
          rm -rf work/romance-detector-repair-20260820/materialized-owner-integrated
          python work/romance-detector-repair-20260820/apply_owner_integrated.py \
            --pass6-master work/romance-detector-repair-20260820/materialized-pass6/candidate-master.md \
            --pass6-part1 work/romance-detector-repair-20260820/materialized-pass6/candidate-part-1.txt \
            --pass6-part2 work/romance-detector-repair-20260820/materialized-pass6/candidate-part-2.txt \
            --output-dir work/romance-detector-repair-20260820/materialized-owner-integrated

      - name: Run full repository regression
        run: python -m unittest discover -s tests

      - name: Validate article authority and repository truth
        run: python scripts/validate_content_repository.py --root .

      - name: Validate article architecture maps
        run: python scripts/validate_article_architecture_maps.py --root .

      - name: Audit Codex and GitHub policy
        run: python scripts/audit_codex_github.py --root . --fail-on error

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit generated candidate only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/romance-detector-repair-20260820/materialized-owner-integrated
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit.'
            exit 0
          fi
          git commit -m 'Materialize Romance owner-integrated candidate'
          git push origin HEAD:task/romance-detector-repair-20260820
