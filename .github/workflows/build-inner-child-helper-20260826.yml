name: Build Inner Child clipboard helper 20260826

on:
  push:
    branches:
      - agent/inner-child-guide-20260826
    paths:
      - '.github/workflows/build-inner-child-helper-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-helper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout joel-articles
        uses: actions/checkout@v4

      - name: Checkout Inner Signal source guide
        uses: actions/checkout@v4
        with:
          repository: u-dont-existDOTcom/innerSignalGraph
          ref: 658d42b5de1e2c512f11a3890561445d82e4140b
          path: innerSignalGraph

      - name: Add conservative native-audio handling to canonical helper in worktree
        run: python3 scripts/enable_conservative_native_audio_transfer_20260826.py --repo "$GITHUB_WORKSPACE"

      - name: Recognize Substack YouTube nocookie iframe as YouTube
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('project-sources/html_islands.py.txt')
          text = path.read_text(encoding='utf-8')
          old = 'if "youtube.com" in low or "youtu.be" in low or "node-youtube" in low or "component-name=\\"youtube" in low:'
          new = 'if "youtube.com" in low or "youtube-nocookie.com" in low or "youtu.be" in low or "node-youtube" in low or "component-name=\\"youtube" in low:'
          if text.count(old) != 1:
              raise SystemExit(f'YouTube classifier patch expected once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Align exact Protector paragraph anchor with Aug 11 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/update_inner_child_guide_20260826.py')
          text = path.read_text(encoding='utf-8')
          old = 'protector_anchor = p("These acts accumulate into trust because internal soothing without external competence can sound like the same unreliability that wounded the child.")'
          new = 'protector_anchor = p("Set one boundary. Say no to something costly. Handle an avoided task or financial mess. Leave a relationship that keeps eroding safety. Keep one small promise. Clean your room. These acts accumulate into trust because internal soothing without external competence can sound like the same unreliability that wounded the child.")'
          if text.count(old) != 1:
              raise SystemExit(f'Protector anchor patch expected once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Materialize updated archival HTML without invoking helper
        run: |
          mkdir -p dist/helper
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          script = Path('scripts/update_inner_child_guide_20260826.py')
          spec = importlib.util.spec_from_file_location('inner_child_update', script)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          source = Path('innerSignalGraph/guide-packets/source-input/inner-child-guide-r01-candidate.html')
          raw = source.read_text(encoding='utf-8')
          updated, operations = mod.apply_edits(raw)
          Path('dist/inner-child-guide-updated-20260826.html').write_text(updated, encoding='utf-8')
          print(f'Applied {len(operations)} operations')
          PY

      - name: Initialize canonical helper plan and print object classification
        run: |
          python3 project-sources/substack_transfer_helper.py.txt selftest
          python3 project-sources/substack_transfer_helper.py.txt init \
            dist/inner-child-guide-updated-20260826.html \
            --plan dist/helper/inner-child-guide-transfer-plan.json \
            --inventory dist/helper/inner-child-guide-native-object-inventory.json \
            --compat-profile project-sources/CONFIRMED-SUBSTACK-HELPER.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('dist/helper/inner-child-guide-transfer-plan.json').read_text())
          print('=== OBJECT PLAN ===')
          for obj in plan.get('objects', []):
              print(json.dumps({k: obj.get(k) for k in ('id','type','strategy','media_id','preceding_anchor','following_anchor')}, ensure_ascii=False))
          bad=[o for o in plan.get('objects',[]) if o.get('strategy')=='unverified']
          if bad:
              raise SystemExit('UNVERIFIED_OBJECTS=' + json.dumps(bad, ensure_ascii=False))
          PY

      - name: Build and verify canonical helper
        run: |
          python3 project-sources/substack_transfer_helper.py.txt build \
            dist/inner-child-guide-updated-20260826.html \
            --plan dist/helper/inner-child-guide-transfer-plan.json \
            --compat-profile project-sources/CONFIRMED-SUBSTACK-HELPER.json \
            --out dist/helper/inner-child-guide-substack-transfer-helper.html \
            --report dist/helper/inner-child-guide-substack-transfer-report.md \
            --compat-report dist/helper/inner-child-guide-substack-compatibility-report.md
          python3 project-sources/substack_transfer_helper.py.txt verify \
            dist/inner-child-guide-updated-20260826.html \
            --plan dist/helper/inner-child-guide-transfer-plan.json \
            --compat-profile project-sources/CONFIRMED-SUBSTACK-HELPER.json \
            --helper dist/helper/inner-child-guide-substack-transfer-helper.html \
            --compat-report dist/helper/inner-child-guide-substack-compatibility-report.md
          cp dist/helper/inner-child-guide-substack-transfer-helper.html \
             dist/inner-child-guide-clipboard-helper-20260826.html

      - name: Upload clipboard helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: inner-child-guide-clipboard-helper-20260826
          path: |
            dist/inner-child-guide-clipboard-helper-20260826.html
            dist/inner-child-guide-updated-20260826.html
            dist/helper/inner-child-guide-substack-transfer-report.md
            dist/helper/inner-child-guide-substack-compatibility-report.md
            dist/helper/inner-child-guide-transfer-plan.json
          if-no-files-found: error
