name: Content integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run regression tests
        run: python -m unittest discover -s tests

      - name: Validate article authority and repository truth
        run: python scripts/validate_content_repository.py --root .

      - name: Validate article architecture maps
        run: python scripts/validate_article_architecture_maps.py --root .

      - name: Audit Codex and GitHub policy
        run: python scripts/audit_codex_github.py --root . --fail-on error
