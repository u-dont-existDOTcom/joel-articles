name: Materialize Romance r10 PR helper

# synchronize trigger after current semantic-r9 Crucible function gate correction
on:
  pull_request:
    branches:
      - task/romance-detector-repair-20260820

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Run focused materializer regression
        run: python -m unittest tests.test_romance_preservation_r10_part1 -q
      - name: Materialize exact candidate
        run: |
          rm -rf work/romance-detector-repair-20260820/materialized-preservation-r10
          python work/romance-detector-repair-20260820/apply_preservation_r10_part1.py \
            --source-master work/romance-detector-repair-20260820/materialized-semantic-r9/candidate-master.md \
            --source-part1 work/romance-detector-repair-20260820/materialized-semantic-r9/candidate-part-1.txt \
            --source-part2 work/romance-detector-repair-20260820/materialized-semantic-r9/candidate-part-2.txt \
            --output-dir work/romance-detector-repair-20260820/materialized-preservation-r10
      - name: Run repository integrity gates
        run: |
          python -m unittest discover -s tests
          python scripts/validate_content_repository.py --root .
          python scripts/validate_article_architecture_maps.py --root .
          python scripts/audit_codex_github.py --root . --fail-on error
          git diff --check
      - name: Commit generated candidate to PR head
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/romance-detector-repair-20260820/materialized-preservation-r10
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize Romance preservation r10 Part 1'
          git push origin HEAD:"$HEAD_REF"
