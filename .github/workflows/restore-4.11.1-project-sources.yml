name: Restore 4.11.1 Project Sources

on:
  push:
    branches:
      - migration/restore-4.11.1-project-sources-2026-08-17
    paths:
      - '.migration/4.11.1/**'
      - 'scripts/restore_project_sources_4_11_1.py'
      - '.github/workflows/restore-4.11.1-project-sources.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: migration/restore-4.11.1-project-sources-2026-08-17

      - name: Wait until staged transport is complete
        id: ready
        shell: bash
        run: |
          if [[ -f .migration/4.11.1/READY ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Transport is not complete yet; exiting without mutation.'
          fi

      - name: Restore and verify exact Project Sources
        if: steps.ready.outputs.ready == 'true'
        run: python scripts/restore_project_sources_4_11_1.py

      - name: Run repository tests
        if: steps.ready.outputs.ready == 'true'
        run: python -m unittest discover -s tests

      - name: Validate repository authority
        if: steps.ready.outputs.ready == 'true'
        run: python scripts/validate_content_repository.py --root .

      - name: Validate article architecture maps
        if: steps.ready.outputs.ready == 'true'
        run: python scripts/validate_article_architecture_maps.py --root .

      - name: Audit repository policy
        if: steps.ready.outputs.ready == 'true'
        run: python scripts/audit_codex_github.py --root . --fail-on error

      - name: Commit restored sources
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Restore complete 4.11.1 Project Source baseline'
          git push origin HEAD:migration/restore-4.11.1-project-sources-2026-08-17
