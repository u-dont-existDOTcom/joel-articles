name: Materialize Romance semantic restore r8

on:
  push:
    branches:
      - task/romance-detector-repair-20260820
    paths:
      - 'work/romance-detector-repair-20260820/apply_semantic_restore_r8.py'
      - 'tests/test_romance_semantic_restore_r8.py'
      - '.github/workflows/materialize-romance-semantic-r8.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: task/romance-detector-repair-20260820
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_romance_semantic_restore_r8 -q
      - name: Materialize exact candidate
        run: |
          rm -rf work/romance-detector-repair-20260820/materialized-semantic-r8
          python work/romance-detector-repair-20260820/apply_semantic_restore_r8.py \
            --source-master work/romance-detector-repair-20260820/materialized-semantic-r7/candidate-master.md \
            --source-part1 work/romance-detector-repair-20260820/materialized-semantic-r7/candidate-part-1.txt \
            --source-part2 work/romance-detector-repair-20260820/materialized-semantic-r7/candidate-part-2.txt \
            --output-dir work/romance-detector-repair-20260820/materialized-semantic-r8
      - name: Run repository integrity gates
        run: |
          python -m unittest discover -s tests
          python scripts/validate_content_repository.py --root .
          python scripts/validate_article_architecture_maps.py --root .
          python scripts/audit_codex_github.py --root . --fail-on error
          git diff --check
      - name: Commit generated candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/romance-detector-repair-20260820/materialized-semantic-r8
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize Romance semantic restore r8'
          git push origin HEAD:task/romance-detector-repair-20260820
