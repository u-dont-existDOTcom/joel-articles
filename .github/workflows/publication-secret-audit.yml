name: Publication secret audit

on:
  pull_request:
    paths:
      - '.github/workflows/publication-secret-audit.yml'
      - 'scripts/audit-publication-secrets.sh'
      - '.github/codex-repository.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: publication-secret-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit public-disclosure surfaces for secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/audit-publication-secrets.sh
