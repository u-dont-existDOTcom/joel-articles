name: Publication secret audit

# The private-to-public disclosure transition completed on 2026-08-19.
# Retain the exhaustive history/hosted-log scan as an archival manual audit.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: publication-secret-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit public-disclosure surfaces for secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/audit-publication-secrets.sh
