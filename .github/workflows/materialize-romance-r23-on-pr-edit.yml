name: Materialize Romance r23 on PR edit

on:
  pull_request:
    types: [edited]
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 46
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: reconcile/romance-r22-20260823
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Fetch exact r22 task ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin task/romance-detector-repair-20260820:refs/remotes/origin/task/romance-detector-repair-20260820

      - name: Materialize exact r23 candidate
        shell: bash
        run: |
          set -euo pipefail
          python work/romance-r22-reconciliation-20260823/materialize_r23_five_owner_edits.py

      - name: Commit materialized candidate and proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/romance-r22-reconciliation-20260823/materialized-r23-five-owner-edits
          if git diff --cached --quiet; then
            echo 'No materialization changes.'
            exit 0
          fi
          git commit -m 'Materialize Romance r23 five-owner-edit candidate'
          git push origin HEAD:reconcile/romance-r22-20260823
